name: ci

on:
  push:
  pull_request:

jobs:
  cancel-suite:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      # Linux: the same docker compose file developers use.
      - name: Start databases (Linux)
        if: runner.os == 'Linux'
        run: docker compose up -d --wait

      - name: Configure test connections (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "DBBLISS_TEST_PG=Host=localhost;Port=55432;Username=dbbliss;Database=dbbliss" >> "$GITHUB_ENV"
          echo "DBBLISS_TEST_PG_PASSWORD=dbbliss-test-Pw1" >> "$GITHUB_ENV"
          echo "DBBLISS_TEST_MSSQL=Server=localhost,51433;User Id=sa;TrustServerCertificate=true" >> "$GITHUB_ENV"
          echo "DBBLISS_TEST_MSSQL_PASSWORD=dbbliss-test-Pw1" >> "$GITHUB_ENV"

      # Windows runners cannot run Linux containers: use the preinstalled PostgreSQL service
      # (user postgres / password root) and SQL Server Express with integrated auth.
      # UNVERIFIED until the first run.
      - name: Start databases (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pg = Get-Service -Name 'postgresql*' | Select-Object -First 1
          Set-Service -InputObject $pg -StartupType Manual
          Start-Service -InputObject $pg
          choco install sql-server-express -y --no-progress
          "DBBLISS_TEST_PG=Host=localhost;Port=5432;Username=postgres;Database=postgres" >> $env:GITHUB_ENV
          "DBBLISS_TEST_PG_PASSWORD=root" >> $env:GITHUB_ENV
          "DBBLISS_TEST_MSSQL=Server=localhost\SQLEXPRESS;Integrated Security=true;TrustServerCertificate=true" >> $env:GITHUB_ENV

      - name: Build backend (Linux)
        if: runner.os == 'Linux'
        run: scripts/build.sh linux-x64

      - name: Build backend (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/build.ps1 -Rid win-x64

      - name: Phase 0 cancel suite
        shell: bash
        run: dotnet run --project backend/tests/Dbbliss.CancelTests -- --report cancel-report.md

      - name: Report
        if: always()
        shell: bash
        run: cat cancel-report.md >> "$GITHUB_STEP_SUMMARY" || true
