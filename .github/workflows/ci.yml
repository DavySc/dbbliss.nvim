name: ci

on:
  push:
  pull_request:

jobs:
  cancel-suite:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      # Linux: the same docker compose file developers use.
      - name: Start databases (Linux)
        if: runner.os == 'Linux'
        run: docker compose up -d --wait

      - name: Configure test connections (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "DBBLISS_TEST_PG=Host=localhost;Port=55432;Username=dbbliss;Database=dbbliss" >> "$GITHUB_ENV"
          echo "DBBLISS_TEST_PG_PASSWORD=dbbliss-test-Pw1" >> "$GITHUB_ENV"
          echo "DBBLISS_TEST_MSSQL=Server=localhost,51433;User Id=sa;TrustServerCertificate=true" >> "$GITHUB_ENV"
          echo "DBBLISS_TEST_MSSQL_PASSWORD=dbbliss-test-Pw1" >> "$GITHUB_ENV"

      # Windows runners cannot run Linux containers: use the preinstalled PostgreSQL service
      # (user postgres / password root) and SQL Server Express with integrated auth.
      # UNVERIFIED until the first run.
      - name: Start databases (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pg = Get-Service -Name 'postgresql*' | Select-Object -First 1
          Set-Service -InputObject $pg -StartupType Manual
          Start-Service -InputObject $pg
          choco install sql-server-express -y --no-progress
          "DBBLISS_TEST_PG=Host=localhost;Port=5432;Username=postgres;Database=postgres" >> $env:GITHUB_ENV
          "DBBLISS_TEST_PG_PASSWORD=root" >> $env:GITHUB_ENV
          "DBBLISS_TEST_MSSQL=Server=localhost\SQLEXPRESS;Integrated Security=true;TrustServerCertificate=true" >> $env:GITHUB_ENV

      # pg_dump must not be older than the server (it refuses): the images are PostgreSQL 17.
      - name: PostgreSQL 17 client tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo "DBBLISS_TEST_PG_BIN=/usr/lib/postgresql/17/bin" >> "$GITHUB_ENV"

      - name: PostgreSQL client tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = Join-Path (Get-ChildItem 'C:\Program Files\PostgreSQL' -Directory | Sort-Object Name -Descending | Select-Object -First 1).FullName 'bin'
          "DBBLISS_TEST_PG_BIN=$bin" >> $env:GITHUB_ENV

      - name: Build backend (Linux)
        if: runner.os == 'Linux'
        run: scripts/build.sh linux-x64

      - name: Build backend (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/build.ps1 -Rid win-x64

      - name: "Credential stores (Linux: a pass store with a throwaway key)"
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get install -y pass gnupg
          export GNUPGHOME="$RUNNER_TEMP/gnupg" PASSWORD_STORE_DIR="$RUNNER_TEMP/pass-store"
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --passphrase "" --quick-gen-key dbbliss-ci@example.invalid default default never
          pass init dbbliss-ci@example.invalid
          printf '%s\n' "$DBBLISS_TEST_PG_PASSWORD" | pass insert -m -f dbbliss/pg
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "PASSWORD_STORE_DIR=$PASSWORD_STORE_DIR" >> "$GITHUB_ENV"
          echo "DBBLISS_TEST_PASS=1" >> "$GITHUB_ENV"
          echo "DBBLISS_E2E_PASS=dbbliss/pg" >> "$GITHUB_ENV"

      - name: "Credential stores (Windows: Credential Manager)"
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmdkey /generic:dbbliss-e2e /user:postgres /pass:root
          "DBBLISS_E2E_CREDMAN=dbbliss-e2e" >> $env:GITHUB_ENV

      - name: Protocol tests (fake engine)
        shell: bash
        run: dotnet run --project backend/tests/Dbbliss.ProtocolTests

      - name: Lua client tests
        shell: bash
        run: |
          nvim --headless --clean --cmd 'set rtp^=.' -l tests/nvim/client_test.lua
          nvim --headless --clean --cmd 'set rtp^=.' -l tests/nvim/results_test.lua
          nvim --headless --clean --cmd 'set rtp^=.' -l tests/nvim/catalog_test.lua
          nvim --headless --clean --cmd 'set rtp^=.' -l tests/nvim/sessions_test.lua
          nvim --headless --clean --cmd 'set rtp^=.' -l tests/nvim/management_test.lua

      - name: End-to-end through the plugin (both engines)
        shell: bash
        run: |
          # PostgreSQL: the password comes from the credential store of the platform (pass / Credential Manager).
          env DBBLISS_E2E_ENGINE=postgres DBBLISS_E2E_CS="$DBBLISS_TEST_PG" \
            nvim --headless --clean --cmd 'set rtp^=.' -l tests/nvim/e2e_test.lua
          env -u DBBLISS_E2E_PASS -u DBBLISS_E2E_CREDMAN DBBLISS_E2E_ENGINE=sqlserver DBBLISS_E2E_CS="$DBBLISS_TEST_MSSQL" ${DBBLISS_TEST_MSSQL_PASSWORD:+DBBLISS_E2E_PW_ENV=DBBLISS_TEST_MSSQL_PASSWORD} \
            nvim --headless --clean --cmd 'set rtp^=.' -l tests/nvim/e2e_test.lua

      - name: Phase 0 cancel suite
        shell: bash
        run: dotnet run --project backend/tests/Dbbliss.CancelTests -- --report cancel-report.md

      - name: Report
        if: always()
        shell: bash
        run: cat cancel-report.md >> "$GITHUB_STEP_SUMMARY" || true

  # The README says Neovim 0.10+: the suites that need no database also run on exactly that version.
  lua-min-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.10.0
      - name: Lua suites on the minimum Neovim
        run: |
          nvim --version | head -1
          nvim --headless --clean --cmd 'set rtp^=.' -l tests/nvim/client_test.lua
          nvim --headless --clean --cmd 'set rtp^=.' -l tests/nvim/results_test.lua
          nvim --headless --clean --cmd 'set rtp^=.' -l tests/nvim/catalog_test.lua
          nvim --headless --clean --cmd 'set rtp^=.' -l tests/nvim/sessions_test.lua
          nvim --headless --clean --cmd 'set rtp^=.' -l tests/nvim/management_test.lua

  # The formal models in spec/ (TLA+ query lifecycle, Quint client/transactions): the proposed design
  # must hold and every other variant must fail the documented way. Linux only; the models do not
  # depend on the OS. A separate job so a slow or red model check does not hide the test results.
  spec-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TLA_JAR: ${{ github.workspace }}/.tools/tla2tools.jar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'   # Apalache (quint verify) needs 21

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The jar and Apalache (which `quint verify` downloads on first use) are fetched once per cache key.
      - uses: actions/cache@v4
        with:
          path: |
            .tools
            ~/.quint
          key: spec-tools-tlc-1.8.0-v1

      - name: Install TLA+ tools and Quint
        shell: bash
        run: |
          mkdir -p .tools
          [ -s "$TLA_JAR" ] || curl -fsSL -o "$TLA_JAR" https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
          npm install -g @informalsystems/quint
          java -version
          quint --version

      - name: Check the models
        shell: bash
        run: spec/check.sh

  # Verification evidence, DO-178C style (docs/assurance/plan.md): requirements-to-test traceability
  # and structural coverage (statement and decision for the backend, statement for Lua) merged over
  # the suites. Linux only: the coverage tools instrument the backend as a child process.
  assurance:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: rhysd/action-setup-vim@v1
        id: vim
        with:
          neovim: true
          version: stable
      - name: Start databases
        run: docker compose up -d --wait
      - name: PostgreSQL 17 client tools
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo "DBBLISS_TEST_PG_BIN=/usr/lib/postgresql/17/bin" >> "$GITHUB_ENV"
      - name: Configure test connections
        run: |
          echo "DBBLISS_TEST_PG=Host=localhost;Port=55432;Username=dbbliss;Database=dbbliss" >> "$GITHUB_ENV"
          echo "DBBLISS_TEST_PG_PASSWORD=dbbliss-test-Pw1" >> "$GITHUB_ENV"
          echo "DBBLISS_TEST_MSSQL=Server=localhost,51433;User Id=sa;TrustServerCertificate=true" >> "$GITHUB_ENV"
          echo "DBBLISS_TEST_MSSQL_PASSWORD=dbbliss-test-Pw1" >> "$GITHUB_ENV"
          echo "NVIM=${{ steps.vim.outputs.executable }}" >> "$GITHUB_ENV"
      - name: Install dotnet-coverage (development tool, not shipped)
        run: |
          dotnet tool install -g dotnet-coverage --version 18.12.0
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: Backend coverage (protocol tests and cancel suite)
        run: scripts/assurance/dotnet-coverage.sh
      - name: Lua coverage (client, results, catalog and end-to-end tests)
        env:
          DBBLISS_E2E_ENGINE: postgres
          DBBLISS_E2E_CS: ${{ env.DBBLISS_TEST_PG }}
          DBBLISS_E2E_PW_ENV: DBBLISS_TEST_PG_PASSWORD
        run: |
          scripts/build.sh linux-x64
          scripts/assurance/lua-coverage.sh
      - name: Traceability (requirements to tests, both directions)
        run: |
          python3 scripts/assurance/trace.py --check
          cat docs/assurance/traceability.md >> "$GITHUB_STEP_SUMMARY"
      - name: Coverage report and gate
        id: gate
        run: |
          code=0
          python3 scripts/assurance/coverage_report.py --check || code=$?
          cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
          exit $code
      - name: Baseline values (commit them to docs/assurance/coverage-baseline.json when they are the intended floor)
        if: always()
        run: |
          python3 scripts/assurance/coverage_report.py --update-baseline > /dev/null
          cat docs/assurance/coverage-baseline.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            coverage/summary.md
            coverage/summary.json
            coverage/*.cobertura.xml
            coverage/luacov.lines.txt
