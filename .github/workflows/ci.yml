name: ci

on:
  push:
  pull_request:

jobs:
  cancel-suite:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      # Linux: the same docker compose file developers use.
      - name: Start databases (Linux)
        if: runner.os == 'Linux'
        run: docker compose up -d --wait

      - name: Configure test connections (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "DBBLISS_TEST_PG=Host=localhost;Port=55432;Username=dbbliss;Database=dbbliss" >> "$GITHUB_ENV"
          echo "DBBLISS_TEST_PG_PASSWORD=dbbliss-test-Pw1" >> "$GITHUB_ENV"
          echo "DBBLISS_TEST_MSSQL=Server=localhost,51433;User Id=sa;TrustServerCertificate=true" >> "$GITHUB_ENV"
          echo "DBBLISS_TEST_MSSQL_PASSWORD=dbbliss-test-Pw1" >> "$GITHUB_ENV"

      # Windows runners cannot run Linux containers: use the preinstalled PostgreSQL service
      # (user postgres / password root) and SQL Server Express with integrated auth.
      # UNVERIFIED until the first run.
      - name: Start databases (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pg = Get-Service -Name 'postgresql*' | Select-Object -First 1
          Set-Service -InputObject $pg -StartupType Manual
          Start-Service -InputObject $pg
          choco install sql-server-express -y --no-progress
          "DBBLISS_TEST_PG=Host=localhost;Port=5432;Username=postgres;Database=postgres" >> $env:GITHUB_ENV
          "DBBLISS_TEST_PG_PASSWORD=root" >> $env:GITHUB_ENV
          "DBBLISS_TEST_MSSQL=Server=localhost\SQLEXPRESS;Integrated Security=true;TrustServerCertificate=true" >> $env:GITHUB_ENV

      - name: Build backend (Linux)
        if: runner.os == 'Linux'
        run: scripts/build.sh linux-x64

      - name: Build backend (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/build.ps1 -Rid win-x64

      - name: "Credential stores (Linux: a pass store with a throwaway key)"
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get install -y pass gnupg
          export GNUPGHOME="$RUNNER_TEMP/gnupg" PASSWORD_STORE_DIR="$RUNNER_TEMP/pass-store"
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --passphrase "" --quick-gen-key dbbliss-ci@example.invalid default default never
          pass init dbbliss-ci@example.invalid
          printf '%s\n' "$DBBLISS_TEST_PG_PASSWORD" | pass insert -m -f dbbliss/pg
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "PASSWORD_STORE_DIR=$PASSWORD_STORE_DIR" >> "$GITHUB_ENV"
          echo "DBBLISS_TEST_PASS=1" >> "$GITHUB_ENV"
          echo "DBBLISS_E2E_PASS=dbbliss/pg" >> "$GITHUB_ENV"

      - name: "Credential stores (Windows: Credential Manager)"
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmdkey /generic:dbbliss-e2e /user:postgres /pass:root
          "DBBLISS_E2E_CREDMAN=dbbliss-e2e" >> $env:GITHUB_ENV

      - name: Protocol tests (fake engine)
        shell: bash
        run: dotnet run --project backend/tests/Dbbliss.ProtocolTests

      - name: Lua client tests
        shell: bash
        run: |
          nvim --headless --clean --cmd 'set rtp^=.' -l tests/nvim/client_test.lua
          nvim --headless --clean --cmd 'set rtp^=.' -l tests/nvim/results_test.lua

      - name: End-to-end through the plugin (both engines)
        shell: bash
        run: |
          # PostgreSQL: the password comes from the credential store of the platform (pass / Credential Manager).
          env DBBLISS_E2E_ENGINE=postgres DBBLISS_E2E_CS="$DBBLISS_TEST_PG" \
            nvim --headless --clean --cmd 'set rtp^=.' -l tests/nvim/e2e_test.lua
          env -u DBBLISS_E2E_PASS -u DBBLISS_E2E_CREDMAN DBBLISS_E2E_ENGINE=sqlserver DBBLISS_E2E_CS="$DBBLISS_TEST_MSSQL" ${DBBLISS_TEST_MSSQL_PASSWORD:+DBBLISS_E2E_PW_ENV=DBBLISS_TEST_MSSQL_PASSWORD} \
            nvim --headless --clean --cmd 'set rtp^=.' -l tests/nvim/e2e_test.lua

      - name: Phase 0 cancel suite
        shell: bash
        run: dotnet run --project backend/tests/Dbbliss.CancelTests -- --report cancel-report.md

      - name: Report
        if: always()
        shell: bash
        run: cat cancel-report.md >> "$GITHUB_STEP_SUMMARY" || true
